name: Buds widget (APK)

on:
  push:
    paths:
      - "3.Widget-Buds-Nothing/**"
      - ".github/workflows/buds-widget.yml"
  workflow_dispatch:

permissions:
  contents: write  # para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3.Widget-Buds-Nothing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Misma clave de firma en cada compilación (queda en la caché privada de Actions,
      # no en el repo), para que cada APK nuevo se instale encima del anterior.
      # Si la caché expira (7 días sin compilar), se genera otra y hay que reinstalar.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: buds-debug-keystore-v1

      - name: Tests del protocolo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: buds-widget-apk
          path: 3.Widget-Buds-Nothing/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Descarga directa sin iniciar sesión:
      # https://github.com/<dueño>/<repo>/releases/latest/download/Buds.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Buds.apk
          gh release delete buds --yes --cleanup-tag || true
          gh release create buds Buds.apk \
            --target "$GITHUB_SHA" \
            --title "Buds · widget para OnePlus Buds 4" \
            --notes "APK para Nothing Phone (2a). Ábrelo en el teléfono e instálalo. Compilado desde ${GITHUB_SHA::7}." \
            --latest
