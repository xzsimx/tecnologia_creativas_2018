name: Buds widget (APK)

on:
  push:
    paths:
      - "3.Widget-Buds-Nothing/**"
      - ".github/workflows/buds-widget.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3.Widget-Buds-Nothing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del protocolo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: buds-widget-apk
          path: 3.Widget-Buds-Nothing/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
